[package]
name = "nova-ta"
version = "0.1.1"
edition = "2024"
description = "Core traits and state primitives for streaming technical-analysis indicators."
license = "MIT"
homepage = "https://gitlab.chipatrade.com/Rick-29/nova"
repository = "https://gitlab.chipatrade.com/Rick-29/nova"
documentation = "https://docs.rs/nova"
readme = "README.md"
keywords = ["technical-analysis", "indicators", "trading", "streaming"]
categories = ["finance", "algorithms"]

[workspace]
members = [".", "nova-bindings-macros", "nova-bindings-macros/integration"]

[features]
# default = ["python", "python-stubs"]
# Foreign-language bindings, generated by `nova-bindings-macros`. All off by default.
python = ["dep:pyo3"]
python-stubs = ["python", "dep:pyo3-stub-gen"]
uniffi = ["dep:uniffi"]
# Builds the `uniffi-bindgen` binary used to generate Kotlin, Swift, Python and Ruby code.
uniffi-cli = ["uniffi", "uniffi/cli"]
wasm = ["dep:wasm-bindgen"]
napi = ["dep:napi", "dep:napi-derive"]

[dependencies]
nova-ta-core = "0.1.6"
thiserror = "2.0.21"
nova-bindings-macros = { version = "0.1.0", path = "nova-bindings-macros" }
pyo3 = { version = "0.30.1", optional = true, features = ["multiple-pymethods"] }
pyo3-stub-gen = { version = "0.23.2", optional = true }
uniffi = { version = "0.32.2", optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }
napi = { version = "3.15.0", optional = true, default-features = false, features = ["napi4"] }
napi-derive = { version = "3.6.13", optional = true }

[[bin]]
name = "stub_gen"
required-features = ["python-stubs"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["uniffi-cli"]
