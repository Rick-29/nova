[package]
name = "nova-bindings-integration"
version = "0.0.0"
edition = "2024"
publish = false
description = "Runtime tests for the code generated by nova-bindings-macros."

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Embedded interpreter so `cargo test --features python` can drive the classes.
python = ["dep:pyo3", "pyo3/auto-initialize"]
python-stubs = ["python", "dep:pyo3-stub-gen"]
uniffi = ["dep:uniffi"]
uniffi-cli = ["uniffi", "uniffi/cli"]
wasm = ["dep:wasm-bindgen"]
napi = ["dep:napi", "dep:napi-derive"]

[dependencies]
nova-bindings-macros = { path = ".." }
nova-ta-core = "0.1.6"
thiserror = "2.0.21"
pyo3 = { version = "0.30.1", optional = true, features = ["multiple-pymethods"] }
pyo3-stub-gen = { version = "0.23.2", optional = true }
uniffi = { version = "0.32.2", optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }
napi = { version = "3.15.0", optional = true, default-features = false, features = ["napi4"] }
napi-derive = { version = "3.6.13", optional = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-cli"]
